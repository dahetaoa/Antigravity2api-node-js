services:
  antigravity-api:
    image: dahetao/antigravity-api:latest
    container_name: antigravity-api
    restart: unless-stopped
    ports:
      - "8045:8045"
    environment:
      - PANEL_USER=admin
      - PANEL_PASSWORD=password
      - API_KEY=sk-123456
      # - DEBUG=low # options: low, high
      # 图片输出配置
      # - IMAGE_OUTPUT_MODE=url        # 可选: base64(默认), url
      # - IMAGE_BASE_URL=http://your-domain.com:8045  # URL模式时的图片访问地址
      # - MAX_IMAGES=10                # URL模式时最大保存图片数量
    volumes:
      - ./data:/app/data
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:' + process.env.PORT + '/healthz', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
